[project]
name = "canvit"
version = "0.1.0"
description = "CanViT: the Canvas Vision Transformer, plus everything that trains and evaluates it -- distillation pretraining, ADE20K/IN1k probes and finetunes, and viewpoint-policy RL, behind one harness"
authors = [{ name = "Yohaï-Eliel BERREBY", email = "me@yberreby.com" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # --- core (was the separate canvit-pytorch distribution until the 2026-09-03 merge) ---
    "numpy>=2.2.0,<2.4.0",
    "fovi",                 # was canvit-pytorch's [fovi] extra; the foveated/square patchers need it
    "timm>=1.0.0",          # was canvit-pytorch's [policy] extra; canvit.core.policy's ConvNeXt-V2 blocks
    # --- training / eval ---
    "dinov3",
    "dinov3-in1k-probes",
    "transformers>=4.50.0",
    "huggingface-hub>=1.3.2",
    "safetensors>=0.7.0",
    "comet-ml",
    "wandb",
    "tyro",
    "tqdm",
    "rich",
    "omegaconf",
    "dacite",
    "optuna",
    "pyarrow",
    "polars",
    "torchmetrics",
    "matplotlib",
    "xxhash",
    "opencv-python-headless>=4.13.0.90",
    "webdataset",
]

[project.optional-dependencies]
# Was canvit-pytorch's [demo] extra. Everything else it listed -- matplotlib, timm,
# transformers, tyro, dinov3-in1k-probes -- is a base dependency here, so only the one
# demos/basic.py import that nothing else needs is left optional.
demo = ["scikit-learn>=1.7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["canvit"]

[tool.uv]
default-groups = ["dev", "cuda"]
# The cu126 (V100+A100) torch in the `cu126` group is a conflicting alternative
# to the default `cuda` (cu13x) torch, so uv keeps two separate locked
# resolutions instead of trying to reconcile them — same pattern as
# CanViT-specialize's cuda/TPU split. Build the V100 + A100 env with:
#   UV_PROJECT_ENVIRONMENT=.venv-cu126 uv sync --no-group cuda --group cu126
conflicts = [[{ group = "cuda" }, { group = "cu126" }]]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
# Local editable: picks up live edits in the sibling fovi clone. This source used to
# live in CanViT-PyTorch/pyproject.toml and was inherited transitively via
# `canvit-pytorch[fovi]`; the core merge folded that package in, so it is declared here
# now. Without it uv would resolve `fovi` from PyPI instead of the fork. Assumes the
# project repos are cloned side by side in one parent folder. Swap back to the remote
# fork — `fovi = { git = "https://github.com/jonaden94/fovi.git" }` — to install without
# the sibling present. See README "Local multi-repo setup".
fovi = { path = "../fovi", editable = true }
dinov3 = { git = "https://github.com/facebookresearch/dinov3.git", rev = "54694f7627fd815f62a5dcc82944ffa6153bbb76" }
dinov3-in1k-probes = { git = "https://github.com/m2b3/dinov3-in1k-probes.git" }
# cu126 group pulls torch/torchvision from the cu126 index (sm_70-compatible).
torch = [{ index = "pytorch-cu126", group = "cu126" }]
torchvision = [{ index = "pytorch-cu126", group = "cu126" }]

[dependency-groups]
dev = [
    "ipykernel",  # Jupyter kernel for notebooks (installed in both .venv and .venv-cu126)
    "basedpyright>=1.36.1",
    "ipython",
    "pypatree",
    "pytest>=9.0.2",
    "pytest-cov",
    "ruff>=0.15.0",
]
# Default GPU/CUDA path (H100, sm_90). torch lives here rather than in
# base dependencies so the cu126 V100+A100 variant can be a conflicting alternative.
cuda = [
    "torch>=2.10",
    "torchvision",
]
# V100 + A100 path: cu126 wheels, pinned for reproducibility (the working
# backup had torch 2.11.0 / torchvision 0.26.0). Installed only via:
#   UV_PROJECT_ENVIRONMENT=.venv-cu126 uv sync --no-group cuda --group cu126
cu126 = [
    "torch==2.11.0",
    "torchvision==0.26.0",
]

[tool.pytest.ini_options]
testpaths = ["canvit"]
python_files = ["test.py", "test_*.py"]
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
    "network: marks tests that require network access (HF Hub downloads, etc.)",
]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["throwaway", "misc"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Harness entry point: sets MPLCONFIGDIR + Agg before matplotlib is imported (DDP-safety).
"canvit/harness/run.py" = ["E402"]

[tool.basedpyright]
typeCheckingMode = "standard"
